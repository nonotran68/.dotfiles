[global/wm]
; Adjust the _NET_WM_STRUT_PARTIAL top value
;   Used for top aligned bars
; Supports any percentage with offset relative to the monitor height
margin-bottom = 0

; Adjust the _NET_WM_STRUT_PARTIAL bottom value
;   Used for bottom aligned bars
; Supports any percentage with offset relative to the monitor height
margin-top = 0

include-file = modules.ini

[cl]
bg = #c8cbb8
fg = #313f0f
bd = #7c6f64
bl = #175bd8
gr = #088948
rd = #520f12
ogr = #af3a03

[bar/bar1]
monitor =
override-redirect = false
wm-restack = bspwm
bottom = false
fixed-center = true

width  = 2.5%
height = 30

offset-x = 1.5%
offset-y = 8pt

background = ${cl.ogr}
foreground = ${cl.bl}

radius = 10.0
border-size = 2
border-color = ${cl.bd}
; Text
font-0 = "Font Awesome 6 Brands:size=18;4"
# font-0 = "JetBrainsMono Nerd Font:style=Regular:size=20;2"
# ; Icons
# font-1 = "Font Awesome 6 Free Solid:size=20;3"
# font-3 = "Material Design Icons Desktop:size=20;3"
;dpi = 96

modules-center = launcher
cursor-click = pointer

[bar/bar2]
monitor =
override-redirect = false
wm-restack = bspwm
bottom = false
fixed-center = true

width  = 18%
height = 30

offset-x = 4.5%
offset-y = 8pt

background = ${cl.bg}
foreground =

radius = 10.0
border-size = 2
border-color = ${cl.bd}
; Text
; font-0 = "Font Awesome 6 Brands:size=18;4"
; font-0 = "JetBrainsMono Nerd Font:style=Regular:size=20;5"
# ; Icons
font-0 = "Font Awesome 6 Free Solid:size=18;4"
font-1 = "Material Design Icons Desktop:size=18;4"
;dpi = 96

modules-center = bspwm
cursor-click = pointer

[bar/bar3]
monitor =
override-redirect = false
wm-restack = bspwm
bottom = false
fixed-center = false

width  = 16.5%
height = 30

offset-x = 23%
offset-y = 8pt

background = ${cl.bg}
foreground =

radius = 10.0
border-size = 2
border-color = ${cl.bd}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
; Icons
; font-0 = "Font Awesome 6 Free Solid:size=18;4"
; font-1 = "Material Design Icons Desktop:size=18;4"
;dpi = 96

modules-left = title

[bar/bar4]
monitor =
override-redirect = false
wm-restack = bspwm
bottom = false
fixed-center = false

width  = 47%
height = 30

offset-x = 51%
offset-y = 8pt

background = ${cl.bg}
foreground =

padding = 2
radius = 10.0
border-size = 2
border-color = ${cl.bd}

font-0 = "JetBrainsMono Nerd Font:style=Regular:size=12;3"

modules-right = network sep audio sep backlight sep cpu sep mem sep battery sep2 date sep hide arrow

[bar/tray]
override-redirect = true

fixed-center = true

width  = 7%
height = 30

offset-x = 90%
offset-y = 31pt

background = ${cl.bg}
foreground =

padding = 2
radius = 10.0
border-size = 2
border-color = ${cl.bd}

modules-right = tray

enable-ipc = true
