; The variables for the polybar modules are taken from this file.

;; Edit according to your system
;; Run `ls -1 /sys/class/power_supply/` to list list batteries and adapters.
;; Run `ls -1 /sys/class/backlight/` to list available graphics cards.
;; Run `ip link | awk '/state UP/ {print $2}' | tr -d :` to get active network interface.

[system]
sys_adapter = AC
sys_battery = BAT0
sys_graphics_card = intel_backlight
sys_network_interface = enp1s0
;;sys_network_interface2 =
include-file = modules.ini

[color]
bg = #2d353b
fg = #d3c6aa

mbg = #f8f5e4
red = #e67e80
pink = #FF0677
purple = #d699b6
blue = #7fbbb3
blue-arch = #0A9CF5
cyan = #83c092
teal = #00B19F
green = #a7c080
lime = #B9C244
yellow = #dbbc7f
amber = #FBC02D
orange = #e69875
brown = #AC8476
grey = #272e33
indigo = #6C77BB
blue-gray = #2d353b

[bar/bar1]
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 98%
height = 28

offset-x = 1%
offset-y = 5

background = ${color.bg}
foreground = ${color.fg}

radius = 1

line-size = 2
line-color = ${color.blue}

border-size = 10px
border-color = ${color.bg}

padding = 1

module-margin-left = 0
module-margin-right = 0

; Text
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"
; Icons
font-1 = "Font Awesome 6 Free Solid:size=13;3"
font-2 = "Material Design Icons Desktop:size=14;3"
font-3 = "Material Design Icons Desktop:size=15;3"
;dpi = 96

;Modules availables but not active:
;	brightness xkeyboard
modules-left = launcher bspwm sep cpu_bar sep memory_bar sep filesystem sep
modules-center =
modules-right = tray sep battery sep pulseaudio sep date sep power

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
