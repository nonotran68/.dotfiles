font_family			JetBrainsMono NF ExtraLight
italic_font			JetBrainsMono NF Light Italic
bold_font			JetBrainsMono NF Bold
bold_italic_font		JetBrainsMono NF Bold Italic
font_size			12.0
force_ltr			no
disable_ligatures	never

# Disable autohide mouse
mouse_hide_wait		0

enable_audio_bell no

# BEGIN_KITTY_THEME
# Solarized Dark Higher Contrast
include current-theme.conf
# END_KITTY_THEME
